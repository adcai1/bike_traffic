<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike Traffic in Boston & Cambridge</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <p class="eyebrow">DSC 106 Lab 7</p>
        <h1>Bike Traffic in Boston &amp; Cambridge</h1>
      </header>

      <div id="map" aria-label="Bike traffic map" role="region"></div>

      <aside class="floating-panel">
        <div class="panel-row">
          <label for="time-slider">Time of day</label>
          <div class="time-output">
            <span id="any-time">Any time</span>
            <time id="selected-time">09:00 AM</time>
          </div>
        </div>
        <input id="time-slider" type="range" min="0" max="1439" value="540" step="1" />
      </aside>

      <div class="legend" aria-label="Traffic direction legend">
        <div class="legend-group">
          <span class="legend-swatch" style="background: #2ec4b6;"></span>
          <span>Mostly arrivals</span>
        </div>
        <div class="legend-group">
          <span class="legend-swatch" style="background: #a5d75b;"></span>
          <span>Balanced</span>
        </div>
        <div class="legend-group">
          <span class="legend-swatch" style="background: #ff9f43;"></span>
          <span>Mostly departures</span>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.js"></script>
    <script type="module" src="map.js"></script>
  </body>
</html>
