<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching — Boston Bike Traffic</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <h1>🚴 Bikewatching</h1>
        <aside class="floating-panel">
          <div class="panel-row">
            <label for="time-slider">Filter by time:</label>
            <input id="time-slider" type="range" min="-1" max="1439" value="625" step="1" />
          </div>
          <div class="time-output">
            <span id="any-time">Any time</span>
            <time id="selected-time">10:25 AM</time>
          </div>
        </aside>
      </header>

      <div id="map" aria-label="Bike traffic map" role="region"></div>

      <div class="legend" aria-label="Traffic direction legend">
        <span class="legend-title">LEGEND:</span>
        <div class="legend-group">
          <span class="legend-swatch" style="background: #4281ab;"></span>
          <span>More departures</span>
        </div>
        <div class="legend-group">
          <span class="legend-swatch" style="background: #bd70a9;"></span>
          <span>Balanced</span>
        </div>
        <div class="legend-group">
          <span class="legend-swatch" style="background: #ff8500;"></span>
          <span>More arrivals</span>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.js"></script>
    <script type="module" src="map.js"></script>
  </body>
</html>
